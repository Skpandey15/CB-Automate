# cb-scanner, cb-agent, cb-patcher, cb-pr, cb-notifier deployments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cb-scanner
  namespace: cb-system
  labels:
    app: cb-scanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cb-scanner
  template:
    metadata:
      labels:
        app: cb-scanner
    spec:
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 1001
      containers:
        - name: cb-scanner
          image: cb-scanner:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: cb-common-config
          env:
            - name: SONARQUBE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: SONARQUBE_TOKEN
            - name: SONARQUBE_URL
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: SONARQUBE_URL
            - name: SCANNER_PROJECTS
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: SCANNER_PROJECTS
            - name: OSS_INDEX_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: OSS_INDEX_USERNAME
                  optional: true
            - name: OSS_INDEX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: OSS_INDEX_TOKEN
                  optional: true
            - name: DEP_SCANNER_REPO_ROOT
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: DEP_SCANNER_REPO_ROOT
                  optional: true
            - name: GITHUB_OWNER
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: GITHUB_OWNER
            - name: GITHUB_REPO
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: GITHUB_REPO
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: GITHUB_TOKEN
          volumeMounts:
            - name: repo-workspace
              mountPath: /workspace/repo
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: repo-workspace
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cb-scanner
  namespace: cb-system
spec:
  selector:
    app: cb-scanner
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cb-agent
  namespace: cb-system
  labels:
    app: cb-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cb-agent
  template:
    metadata:
      labels:
        app: cb-agent
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
      containers:
        - name: cb-agent
          image: cb-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: cb-common-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: ANTHROPIC_API_KEY
            - name: SPRING_AI_OLLAMA_CHAT_ENABLED
              value: "false"
            - name: GITHUB_OWNER
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: GITHUB_OWNER
            - name: GITHUB_REPO
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: GITHUB_REPO
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: GITHUB_TOKEN
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "750m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 45
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: cb-agent
  namespace: cb-system
spec:
  selector:
    app: cb-agent
  ports:
    - port: 8082
      targetPort: 8082
---
