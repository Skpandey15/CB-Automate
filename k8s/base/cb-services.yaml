apiVersion: apps/v1
kind: Deployment
metadata:
  name: cb-notifier
  namespace: cb-system
  labels:
    app: cb-notifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cb-notifier
  template:
    metadata:
      labels:
        app: cb-notifier
    spec:
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
      containers:
        - name: cb-notifier
          image: cb-notifier:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: cb-common-config
          env:
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: SMTP_PORT
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: SMTP_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: SMTP_PASSWORD
            - name: NOTIFIER_TEAM_EMAILS
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: NOTIFIER_TEAM_EMAILS
            - name: DATADOG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: DATADOG_API_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "200m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
---
