---
# Kafka 3.7 in KRaft mode — Confluent Platform image with reliable KRaft entrypoint
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: cb-system
  labels:
    app: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.7.0
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qg"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512m -Xms256m"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# Kafka init job – creates all CB topics
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: cb-system
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z kafka 9092; do echo waiting for kafka; sleep 5; done']
      containers:
        - name: topic-creator
          image: confluentinc/cp-kafka:7.7.0
          command:
            - sh
            - -c
            - |
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic vulnerabilities.detected  --partitions 3 --replication-factor 1 &&
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic fixes.generated          --partitions 3 --replication-factor 1 &&
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic fixes.validated          --partitions 3 --replication-factor 1 &&
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic pr.created              --partitions 3 --replication-factor 1 &&
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic escalations.triggered   --partitions 1 --replication-factor 1 &&
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic review.feedback         --partitions 3 --replication-factor 1 &&
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic cost.tracked            --partitions 1 --replication-factor 1 &&
              echo "All topics created."
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: cb-system
spec:
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
