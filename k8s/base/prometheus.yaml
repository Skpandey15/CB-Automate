---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cb-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: cb-scanner
        static_configs:
          - targets: ['cb-scanner:8081']
        metrics_path: /actuator/prometheus

      - job_name: cb-agent
        static_configs:
          - targets: ['cb-agent:8082']
        metrics_path: /actuator/prometheus

      - job_name: cb-patcher
        static_configs:
          - targets: ['cb-patcher:8083']
        metrics_path: /actuator/prometheus

      - job_name: cb-pr
        static_configs:
          - targets: ['cb-pr:8084']
        metrics_path: /actuator/prometheus

      - job_name: cb-notifier
        static_configs:
          - targets: ['cb-notifier:8085']
        metrics_path: /actuator/prometheus

      - job_name: cb-api
        static_configs:
          - targets: ['cb-api:8080']
        metrics_path: /actuator/prometheus

      - job_name: cb-mcp-server
        static_configs:
          - targets: ['cb-mcp-server:8086']
        metrics_path: /actuator/prometheus

      - job_name: cb-escalation
        static_configs:
          - targets: ['cb-escalation:8087']
        metrics_path: /actuator/prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cb-system
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: prometheus-data
              mountPath: /prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: prometheus-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cb-system
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
