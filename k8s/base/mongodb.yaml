apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cb-mongodb-pvc
  namespace: cb-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cb-mongodb
  namespace: cb-system
  labels:
    app: cb-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cb-mongodb
  template:
    metadata:
      labels:
        app: cb-mongodb
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: compliance_buddy
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cb-mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cb-mongodb
  namespace: cb-system
spec:
  selector:
    app: cb-mongodb
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP
