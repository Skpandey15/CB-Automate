apiVersion: apps/v1
kind: Deployment
metadata:
  name: cb-escalation
  namespace: cb-system
  labels:
    app: cb-escalation
    component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cb-escalation
  template:
    metadata:
      labels:
        app: cb-escalation
        component: agent
    spec:
      containers:
        - name: cb-escalation
          image: cb-escalation:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8089
          envFrom:
            - configMapRef:
                name: cb-config
            - secretRef:
                name: cb-secrets
          env:
            - name: KAFKA_ESCALATION_GROUP_ID
              value: "cb-escalation-group"
            - name: OTEL_SERVICE_NAME
              value: "cb-escalation"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8089
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8089
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cb-escalation
  namespace: cb-system
spec:
  selector:
    app: cb-escalation
  ports:
    - port: 8089
      targetPort: 8089
  type: ClusterIP
