apiVersion: apps/v1
kind: Deployment
metadata:
  name: cb-python-embedder
  namespace: cb-system
  labels:
    app: cb-python-embedder
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cb-python-embedder
  template:
    metadata:
      labels:
        app: cb-python-embedder
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8090"
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
      containers:
        - name: cb-python-embedder
          image: cb-python-embedder:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: cb-common-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cb-secrets
                  key: OPENAI_API_KEY
            - name: WORKERS
              value: "4"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: cb-python-embedder
  namespace: cb-system
spec:
  selector:
    app: cb-python-embedder
  ports:
    - port: 8090
      targetPort: 8090
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cb-python-embedder-hpa
  namespace: cb-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cb-python-embedder
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
