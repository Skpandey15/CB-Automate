apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: cb-system
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      initContainers:
        # Pre-pull models on startup so they are available immediately
        - name: pull-models
          image: ollama/ollama:0.3.0
          command:
            - sh
            - -c
            - |
              ollama serve &
              sleep 10
              ollama pull llama3:8b && echo "llama3:8b ready"
              ollama pull qwen2:7b  && echo "qwen2:7b ready"
              kill %1
          env:
            - name: OLLAMA_MODELS
              value: /ollama-models
          volumeMounts:
            - name: ollama-models
              mountPath: /ollama-models
      containers:
        - name: ollama
          image: ollama/ollama:0.3.0
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_MODELS
              value: /ollama-models
            - name: OLLAMA_KEEP_ALIVE
              value: "24h"
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "6Gi"
              cpu: "4000m"
          volumeMounts:
            - name: ollama-models
              mountPath: /ollama-models
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-models-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  namespace: cb-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: cb-system
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
