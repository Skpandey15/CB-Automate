spring:
  application:
    name: cb-notifier
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/compliance_buddy}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_NOTIFIER_GROUP_ID:cb-notifier-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "in.techseva.cb.core.kafka"
  cache:
    type: caffeine
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.metrics.export.datadog.DatadogMetricsExportAutoConfiguration
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8085

notifier:
  team-emails: ${NOTIFIER_TEAM_EMAILS:}
  from-email: ${NOTIFIER_FROM_EMAIL:cb-bot@techseva.in}

jira:
  enabled: ${JIRA_ENABLED:false}
  base-url: ${JIRA_BASE_URL:}
  email: ${JIRA_EMAIL:}
  api-token: ${JIRA_API_TOKEN:}
  project-key: ${JIRA_PROJECT_KEY:CB}

teams:
  enabled: ${TEAMS_ENABLED:false}
  webhook-url: ${TEAMS_WEBHOOK_URL:}

datadog:
  api-key: ${DATADOG_API_KEY:}
  site: ${DATADOG_SITE:datadoghq.com}
  env: ${DATADOG_ENV:production}

resilience4j:
  circuitbreaker:
    instances:
      datadog-api:
        slidingWindowSize: 5
        failureRateThreshold: 60
        waitDurationInOpenState: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false
  tracing:
    enabled: ${OTEL_ENABLED:true}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318/v1/traces}
