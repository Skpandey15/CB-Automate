spring:
  application:
    name: cb-agent
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/compliance_buddy}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_AGENT_GROUP_ID:cb-agent-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "in.techseva.cb.core.kafka"
        spring.json.use.type.headers: false
        spring.json.value.default.type: "in.techseva.cb.core.kafka.VulnerabilityKafkaEvent"
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  cache:
    type: redis
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.metrics.export.datadog.DatadogMetricsExportAutoConfiguration
      - org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
      - org.springframework.ai.vectorstore.elasticsearch.autoconfigure.ElasticsearchVectorStoreAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o
          temperature: 0.1
          max-tokens: 4096
      embedding:
        options:
          model: text-embedding-3-small
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-6
          temperature: 0.1
          max-tokens: 4096
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL_DEFAULT:llama3:8b}
          temperature: 0.1
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        collection-name: ${QDRANT_COLLECTION:cb_fixes}
        initialize-schema: true

server:
  port: 8082

agent:
  primary-model: ${AGENT_PRIMARY_MODEL:gpt-4o}
  fallback-model: ${AGENT_FALLBACK_MODEL:gpt-4o}
  mcp:
    server-url: ${MCP_SERVER_URL:http://localhost:8086}

ollama:
  model:
    low-severity: ${OLLAMA_MODEL_LOW:llama3:8b}
    medium-severity: ${OLLAMA_MODEL_MEDIUM:qwen2:7b}

github:
  owner: ${GITHUB_OWNER:}
  repo: ${GITHUB_REPO:}
  token: ${GITHUB_TOKEN:}

embedder:
  url: ${EMBEDDER_URL:http://localhost:8090}

resilience4j:
  circuitbreaker:
    instances:
      llm-agent:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
      embedder-api:
        slidingWindowSize: 5
        failureRateThreshold: 60
        waitDurationInOpenState: 20s
  retry:
    instances:
      llm-agent:
        maxAttempts: 3
        waitDuration: 5s
        exponentialBackoffMultiplier: 2.0
      embedder-api:
        maxAttempts: 2
        waitDuration: 2s
  timelimiter:
    instances:
      llm-agent:
        timeoutDuration: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    enabled: ${OTEL_ENABLED:true}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318/v1/traces}
