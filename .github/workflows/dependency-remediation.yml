name: Dependency remediation

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Existing target branch to scan and open the PR against
        required: true
        default: main
        type: string
      publish:
        description: Publish verified changes and email the configured recipients
        default: false
        type: boolean
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-remediation-${{ github.repository }}-${{ inputs.branch || vars.CB_TARGET_BRANCH || 'main' }}
  cancel-in-progress: false

jobs:
  remediate:
    # A schedule is inert until repository administrators explicitly enable it.
    if: github.event_name == 'workflow_dispatch' || vars.CB_DEPENDENCY_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ vars.CB_JAVA_VERSION || '21' }}
      - name: Authenticate Git
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Test the runner
        run: python -m unittest discover -s scripts/dependency-remediation -p 'test_*.py' -v
      - name: Scan, validate, publish and notify
        env:
          GH_TOKEN: ${{ github.token }}
          CB_REPOSITORY: ${{ github.repository }}
          CB_BRANCH: ${{ inputs.branch || vars.CB_TARGET_BRANCH || 'main' }}
          CB_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
          CB_RECIPIENTS: ${{ vars.CB_RECIPIENTS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          command = [sys.executable, 'scripts/dependency-remediation/remediate.py',
                     '--repo', os.environ['CB_REPOSITORY'], '--branch', os.environ['CB_BRANCH'],
                     '--output', '.cb-runs']
          if os.environ['CB_PUBLISH'].lower() == 'true':
              command.append('--publish')
              for recipient in os.environ.get('CB_RECIPIENTS', '').split(','):
                  if recipient.strip():
                      command.extend(['--recipient', recipient.strip()])
          sys.exit(subprocess.call(command))
          PY
      - name: Save reports even when findings remain or a step fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-remediation-${{ github.run_id }}
          include-hidden-files: true
          path: |
            .cb-runs/*/report.json
            .cb-runs/*/report.md
            .cb-runs/*/changes.patch
          if-no-files-found: ignore
          retention-days: 30
