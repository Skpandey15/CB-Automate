spring:
  application:
    name: cb-patcher
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/compliance_buddy}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_PATCHER_GROUP_ID:cb-patcher-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "in.techseva.cb.core.kafka"
  cache:
    type: caffeine
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.metrics.export.datadog.DatadogMetricsExportAutoConfiguration
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}

server:
  port: 8083

patcher:
  repo-root: ${PATCHER_REPO_ROOT:/workspace/repo}
  build-timeout-minutes: ${PATCHER_BUILD_TIMEOUT_MINUTES:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    enabled: ${OTEL_ENABLED:true}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318/v1/traces}
