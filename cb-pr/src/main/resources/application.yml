spring:
  application:
    name: cb-pr
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/compliance_buddy}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_PR_GROUP_ID:cb-pr-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "in.techseva.cb.core.kafka"
        spring.json.use.type.headers: false
        spring.json.value.default.type: "in.techseva.cb.core.kafka.FixKafkaEvent"
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:placeholder}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:placeholder}
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.metrics.export.datadog.DatadogMetricsExportAutoConfiguration
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}

server:
  port: 8084

github:
  api-url: ${GITHUB_API_URL:https://api.github.com}
  token: ${GITHUB_TOKEN:}
  owner: ${GITHUB_OWNER:}
  repo: ${GITHUB_REPO:}
  default-branch: ${GITHUB_DEFAULT_BRANCH:main}
  reviewer-username: ${GITHUB_REVIEWER_USERNAME:}

version1:
  api-url: ${VERSION1_API_URL:}
  token: ${VERSION1_TOKEN:}
  default-assignee: ${VERSION1_DEFAULT_ASSIGNEE:CB-Bot}

patcher:
  repo-root: ${PATCHER_REPO_ROOT:/workspace/repo}

opa:
  url: ${OPA_URL:http://opa:8181}
  policy: ${OPA_POLICY:cb/governance}
  enabled: ${OPA_ENABLED:true}

resilience4j:
  circuitbreaker:
    instances:
      github-api:
        slidingWindowSize: 20
        failureRateThreshold: 40
        waitDurationInOpenState: 60s
      version1-api:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
  retry:
    instances:
      github-api:
        maxAttempts: 3
        waitDuration: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    enabled: ${OTEL_ENABLED:true}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318/v1/traces}
