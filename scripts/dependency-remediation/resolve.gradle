// Export the actual graph, not versions guessed from build-file text.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

gradle.projectsEvaluated {
    rootProject.tasks.register('cbExportDependencies') {
        doLast {
            def rows = []
            rootProject.allprojects.each { project ->
                project.configurations.findAll { it.canBeResolved }.each { configuration ->
                    def result = configuration.incoming.resolutionResult
                    def failures = result.allDependencies.findAll { it instanceof UnresolvedDependencyResult }
                    if (!failures.empty) {
                        throw new GradleException("Unresolved dependencies in ${project.path}:${configuration.name}: " +
                            failures.collect { it.attempted.displayName }.join(', '))
                    }
                    result.allComponents.each { component ->
                        if (component.id instanceof ModuleComponentIdentifier) {
                            rows << [name: "${component.id.group}:${component.id.module}".toString(),
                                     version: component.id.version,
                                     module: project.path,
                                     scope: configuration.name]
                        }
                    }
                }
            }
            def output = new File(System.getProperty('cb.dependencies.output'))
            output.parentFile.mkdirs()
            output.text = JsonOutput.toJson(rows)
        }
    }
}
